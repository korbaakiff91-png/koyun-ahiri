<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koyun Ahırı Simülatörü - URL & Overlay Sürümü</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #120d0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }
    body.transparent-bg { background: transparent !important; }
    .stream-frame {
      position: relative;
      width: 405px;
      height: 720px;
      background: linear-gradient(180deg, #5c2d12 0%, #8a4318 25%, #3d6b2c 26%, #2f5721 100%);
      border-radius: 18px;
      border: 3px solid #d97706;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    body.transparent-bg .stream-frame {
      box-shadow: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(45, 22, 8, 0.88);
      border: 1.5px solid #f59e0b;
      border-radius: 12px;
      padding: 8px 12px;
    }
    .title-box h1 { font-size: 15px; color: #fde68a; letter-spacing: 0.4px; }
    .title-box p { font-size: 11px; color: #fed7aa; margin-top: 2px; }
    .badge-katil {
      background: #10b981;
      color: #052e16;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
    }
    .stats { display: flex; gap: 6px; }
    .stat-pill {
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 9px;
      padding: 4px 9px;
      text-align: center;
      min-width: 52px;
    }
    .stat-pill span { display: block; font-size: 9px; color: #fcd34d; font-weight: 700; }
    .stat-pill strong { font-size: 15px; color: #fff; }
    .ram-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, rgba(180, 83, 9, 0.92), rgba(217, 119, 6, 0.92));
      border: 1.5px solid #fde047;
      border-radius: 12px;
      padding: 7px 11px;
    }
    .ram-info { font-size: 11px; }
    .ram-tag {
      background: #fef08a;
      color: #713f12;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 10px;
      margin-right: 4px;
    }
    .ram-name { font-weight: 800; font-size: 13px; color: #fff; }
    .ram-sub { font-size: 10px; color: #fef3c7; margin-top: 2px; }
    .speed-badge {
      background: rgba(0,0,0,0.35);
      border: 1px solid #fde047;
      color: #fef08a;
      font-weight: 800;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .leaders-bar {
      background: rgba(28, 15, 7, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 11px;
      color: #fde68a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .banner {
      position: absolute;
      top: 158px;
      left: 16px;
      right: 16px;
      background: rgba(17, 24, 39, 0.92);
      border: 2px solid #facc15;
      border-radius: 12px;
      padding: 9px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #fef08a;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 15;
    }
    .banner.show { opacity: 1; transform: translateY(0); }
    .gear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #fbbf24;
      background: rgba(30, 20, 12, 0.9);
      color: #fff;
      font-size: 19px;
      cursor: pointer;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-panel {
      position: absolute;
      right: 12px;
      left: 12px;
      top: 155px;
      background: rgba(24, 16, 10, 0.97);
      border: 2px solid #f59e0b;
      border-radius: 14px;
      padding: 13px;
      z-index: 30;
      display: none;
      flex-direction: column;
      gap: 9px;
    }
    .settings-panel.open { display: flex; }
    .settings-panel h3 { font-size: 13px; color: #fcd34d; display: flex; justify-content: space-between; align-items: center; }
    .row { display: flex; gap: 6px; }
    input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #78350f;
      background: #29180d;
      color: #fff;
      font-size: 11px;
    }
    button.btn {
      padding: 6px 9px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-green { background: #10b981; color: #052e16; }
    .btn-amber { background: #f59e0b; color: #271300; }
    .btn-red { background: #ef4444; color: #fff; }
    .status-line { font-size: 10.5px; color: #d1d5db; }
    .url-box {
      background: #1c1008;
      border: 1px dashed #f59e0b;
      border-radius: 8px;
      padding: 7px;
      font-size: 10px;
      color: #fde68a;
      word-break: break-all;
    }
    .bottom-controls {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      z-index: 20;
    }
    .hidden-ui { display: none !important; }
    .test-btn {
      background: rgba(28, 17, 10, 0.92);
      border: 1.5px solid #d97706;
      border-radius: 10px;
      padding: 7px 4px;
      color: #fff;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .test-btn:active { transform: scale(0.95); }
    .test-btn:hover { background: rgba(69, 39, 18, 0.96); }
    .test-btn .icon { font-size: 14px; display: block; margin-bottom: 2px; }
    .test-btn .lbl { font-size: 10px; font-weight: 800; color: #fde68a; display: block; }
    .test-btn .sub { font-size: 9px; color: #fed7aa; display: block; }
  </style>
</head>
<body>
  <div class="stream-frame">
    <canvas id="barnCanvas" width="405" height="720"></canvas>

    <div class="hud">
      <div class="top-bar">
        <div class="title-box">
          <h1>🐑 KOYUN AHIRI</h1>
          <p>Yoruma <span class="badge-katil">KATIL</span> yaz!</p>
        </div>
        <div class="stats">
          <div class="stat-pill"><span>SÜRÜ</span><strong id="sheepCount">0</strong></div>
          <div class="stat-pill"><span>BEĞENİ</span><strong id="likeCount">0</strong></div>
        </div>
      </div>

      <div class="ram-card">
        <div class="ram-info">
          <div><span class="ram-tag">👑 ERKEK KOÇ</span> <span class="ram-name" id="ramName">Kral Karabaş</span></div>
          <div class="ram-sub" id="ramOwner">Sahibi: @Sahipsiz • Aslan / Taç at, ismini ver!</div>
        </div>
        <div class="speed-badge" id="speedBadge">1x Hız</div>
      </div>

      <div class="leaders-bar" id="leadersBar">🏆 LİDERLER: Henüz katılan yok...</div>
    </div>

    <div class="banner" id="bannerBox">Hoş geldin!</div>

    <button class="gear-btn" id="gearBtn" title="Yayıncı Ayarları">⚙️</button>

    <div class="settings-panel" id="settingsPanel">
      <h3>
        <span>⚙️ URL & TikFinity Ayarları</span>
        <button class="btn btn-red" id="closeSettingsBtn">Kapat</button>
      </h3>
      <div class="row">
        <input type="text" id="wsUrlInput" value="ws://localhost:21213/" />
        <button class="btn btn-green" id="wsConnectBtn">Bağlan</button>
      </div>
      <div class="status-line" id="wsStatus">Durum: Bağlı değil</div>
      <div class="row">
        <input type="text" id="customUserInput" placeholder="Test kullanıcı adı" />
        <button class="btn btn-amber" id="customJoinBtn">Katıl Ekle</button>
      </div>
      <div class="row">
        <button class="btn btn-green" id="toggleSoundBtn">🔊 Ses: AÇIK</button>
        <button class="btn btn-red" id="resetBarnBtn">Sıfırla</button>
      </div>
      <div class="status-line">TikTok Live Studio Bağlantı (Overlay) URL'si:</div>
      <div class="url-box" id="generatedUrlBox"></div>
      <button class="btn btn-amber" id="copyOverlayUrlBtn">🔗 Yayın Bağlantı URL'sini Kopyala</button>
    </div>

    <div class="bottom-controls" id="bottomControls">
      <button class="test-btn" id="btnTestJoin">
        <span class="icon">💬</span>
        <span class="lbl">"KATIL"</span>
        <span class="sub">Koyun Al</span>
      </button>
      <button class="test-btn" id="btnTestLike">
        <span class="icon">❤️</span>
        <span class="lbl">BEĞENİ</span>
        <span class="sub">Otla Besle</span>
      </button>
      <button class="test-btn" id="btnTestGift">
        <span class="icon">🌹</span>
        <span class="lbl">HEDİYE</span>
        <span class="sub">Büyüt & Doğur</span>
      </button>
      <button class="test-btn" id="btnTestRam">
        <span class="icon">👑</span>
        <span class="lbl">ASLAN/TAÇ</span>
        <span class="sub">Koça İsim Ver</span>
      </button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const paramWs = params.get('ws') || 'ws://localhost:21213/';
    const paramAutoWs = params.get('autows') !== '0';
    const paramTransparent = params.get('transparent') === '1';
    const paramHideControls = params.get('hidecontrols') === '1';
    const paramRamName = params.get('ram') || 'Kral Karabaş';
    const paramSound = params.get('sound') !== '0';

    if (paramTransparent) {
      document.body.classList.add('transparent-bg');
    }
    if (paramHideControls) {
      document.getElementById('bottomControls').classList.add('hidden-ui');
      document.getElementById('gearBtn').classList.add('hidden-ui');
    }

    const canvas = document.getElementById('barnCanvas');
    const ctx = canvas.getContext('2d');

    const sheepCountEl = document.getElementById('sheepCount');
    const likeCountEl = document.getElementById('likeCount');
    const ramNameEl = document.getElementById('ramName');
    const ramOwnerEl = document.getElementById('ramOwner');
    const speedBadgeEl = document.getElementById('speedBadge');
    const leadersBarEl = document.getElementById('leadersBar');
    const bannerBox = document.getElementById('bannerBox');
    const wsUrlInput = document.getElementById('wsUrlInput');
    wsUrlInput.value = paramWs;

    let soundEnabled = paramSound;
    let totalLikes = 0;
    let speedMultiplier = 1;
    let socket = null;
    let bannerTimer = null;
    let reconnectTimer = null;

    const sampleNames = ['Ayse_34', 'MehmetKral', 'Zeynep06', 'CanerBey', 'ElifNur', 'Burak_TR', 'Selinay', 'EmreCan', 'MerveYilmaz', 'KaanAbi'];
    let sampleIndex = 0;

    const ram = {
      x: 202,
      y: 350,
      vx: 0.7,
      vy: 0.4,
      name: paramRamName,
      owner: 'Sahipsiz',
      hasOwner: false
    };

    const sheepList = [];
    const grasses = [];
    const lambs = [];

    function buildOverlayUrl() {
      const base = window.location.origin + window.location.pathname;
      const wsEncoded = encodeURIComponent(wsUrlInput.value.trim() || 'ws://localhost:21213/');
      return `${base}?autows=1&transparent=1&hidecontrols=1&ws=${wsEncoded}`;
    }

    function refreshGeneratedUrl() {
      document.getElementById('generatedUrlBox').textContent = buildOverlayUrl();
    }

    function showBanner(text) {
      bannerBox.textContent = text;
      bannerBox.classList.add('show');
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        bannerBox.classList.remove('show');
      }, 3200);
    }

    function speakText(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'tr-TR';
        utter.rate = 1.02;
        utter.pitch = 1.05;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function updateHUD() {
      sheepCountEl.textContent = sheepList.length + lambs.length;
      likeCountEl.textContent = totalLikes;
      ramNameEl.textContent = ram.name;
      ramOwnerEl.textContent = ram.hasOwner
        ? `Sahibi: @${ram.owner} • Aktif Lider Koç`
        : 'Sahibi: @Sahipsiz • Aslan / Taç at, ismini ver!';
      speedBadgeEl.textContent = `${speedMultiplier}x Hız`;

      if (sheepList.length === 0) {
        leadersBarEl.textContent = '🏆 LİDERLER: Henüz katılan yok...';
      } else {
        const sorted = [...sheepList].sort((a, b) => (b.growth + b.babies * 100) - (a.growth + a.babies * 100));
        const top3 = sorted.slice(0, 3).map((s, idx) => `${idx + 1}.${s.owner}(%${Math.min(100, Math.round(s.growth))})`).join('  ');
        leadersBarEl.textContent = `🏆 LİDERLER: ${top3}`;
      }
    }

    function addSheep(username) {
      const cleanName = (username || 'Misafir').trim().replace(/^@/, '');
      const existing = sheepList.find(s => s.owner.toLowerCase() === cleanName.toLowerCase());
      if (existing) {
        existing.growth += 15;
        checkBirth(existing);
        showBanner(`🐑 @${cleanName} koyununu besledi!`);
        updateHUD();
        return;
      }
      const sheep = {
        id: Date.now() + Math.random(),
        owner: cleanName,
        x: 60 + Math.random() * 285,
        y: 230 + Math.random() * 380,
        vx: (Math.random() - 0.5) * 1.6,
        vy: (Math.random() - 0.5) * 1.2,
        growth: 20,
        babies: 0,
        color: '#fffbeb'
      };
      sheepList.push(sheep);
      showBanner(`🎉 Hoş geldin @${cleanName}, koyunun ahıra girdi!`);
      speakText(`Hoş geldin ${cleanName}, koyunun ahıra katıldı!`);
      updateHUD();
    }

    function dropGrass(count = 4) {
      totalLikes += count;
      for (let i = 0; i < count; i++) {
        grasses.push({
          x: 35 + Math.random() * 335,
          y: 220 + Math.random() * 410,
          value: 14 * speedMultiplier
        });
      }
      updateHUD();
    }

    function checkBirth(sheep) {
      if (sheep.growth >= 100) {
        sheep.growth = 25;
        sheep.babies += 1;
        lambs.push({
          parent: sheep,
          x: sheep.x - 18,
          y: sheep.y + 12
        });
        showBanner(`🍼 @${sheep.owner} adlı oyuncunun koyunu DOĞUM YAPTI! (+1 Kuzu)`);
        speakText(`Tebrikler ${sheep.owner}, koyunun doğum yaptı ve bir kuzun oldu!`);
      }
    }

    function feedWithGift(username, boost = 45) {
      const cleanName = (username || '').trim().replace(/^@/, '');
      let target = sheepList.find(s => s.owner.toLowerCase() === cleanName.toLowerCase());
      if (!target && sheepList.length > 0) {
        target = sheepList[Math.floor(Math.random() * sheepList.length)];
      }
      if (!target) {
        addSheep(cleanName || 'HediyeSever');
        target = sheepList[sheepList.length - 1];
      }
      target.growth += boost * speedMultiplier;
      showBanner(`🎁 @${target.owner} hediye ile koyununu büyüttü! (%${Math.min(100, Math.round(target.growth))})`);
      checkBirth(target);
      updateHUD();
    }

    function claimRam(username, customRamName) {
      const cleanName = (username || 'KralOyuncu').trim().replace(/^@/, '');
      ram.owner = cleanName;
      ram.hasOwner = true;
      ram.name = customRamName || `${cleanName}'in Koçu`;
      speedMultiplier = 2;
      showBanner(`👑 @${cleanName} ERKEK KOÇU SAHİPLENDİ! Yeni adı: ${ram.name} (2x Hız)`);
      speakText(`Muhteşem! ${cleanName} erkek koça kendi adını verdi. Tüm ahır artık iki kat hızlı büyüyor!`);
      updateHUD();
    }

    function drawBarn() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#5c2d12';
      ctx.fillRect(0, 0, canvas.width, 195);

      ctx.fillStyle = '#3e1d0b';
      for (let i = 0; i < canvas.width; i += 45) {
        ctx.fillRect(i, 0, 8, 195);
      }

      const grassGrad = ctx.createLinearGradient(0, 195, 0, 720);
      grassGrad.addColorStop(0, '#4d7c0f');
      grassGrad.addColorStop(1, '#365314');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, 195, canvas.width, 525);

      ctx.fillStyle = '#92400e';
      ctx.fillRect(0, 192, canvas.width, 10);
      ctx.fillRect(0, 645, canvas.width, 10);
      for (let x = 12; x < canvas.width; x += 36) {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(x, 182, 10, 26);
        ctx.fillRect(x, 636, 10, 26);
      }

      grasses.forEach(g => {
        ctx.fillStyle = '#bef264';
        ctx.beginPath();
        ctx.arc(g.x, g.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x - 4, g.y - 8);
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x + 4, g.y - 8);
        ctx.stroke();
      });

      lambs.forEach(l => {
        l.x += (l.parent.x - 24 - l.x) * 0.04;
        l.y += (l.parent.y + 14 - l.y) * 0.04;
        drawAnimal(l.x, l.y, 0.62, '#ffffff', '#1f2937',
